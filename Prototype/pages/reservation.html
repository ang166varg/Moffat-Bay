<div class="reservation-container">
    <form class="reservation-form">
        <h2 class="reservation-title">Make a Reservation</h2>

        
        <label class="reservation-label">Select Date</label>
        <input type="date" class="reservation-input" required>

     
        <label class="reservation-label">Choose Room</label>
        <select class="reservation-select" required>
            <option value="">-- Select Room --</option>
            <option>Private Room: $150/night</option>
            <option>Family Room: $200/night</option>
            <option>Couples Room: $250/night</option>
        </select>
        <label class="reservation-label">Number of Guests</label>
        <select class="reservation-select" required>
            <option value="">-- Select Number of Guests --</option>
            <option>1-2 Guests</option>
            <option>3-4 Guests</option>
            <option>5-6 Guests</option>
        </select>

     
        <label class="reservation-label">Add Experiences</label>

        <div class="reservation-checkbox-group">
            <label><input type="checkbox"> Guided Hike</label>
            <label><input type="checkbox"> Paddleboarding</label>
            <label><input type="checkbox"> Smore Kit</label>
            <label><input type="checkbox"> Kayaking</label>
            <label><input type="checkbox"> Basket Weaving</label>
        </div>

        <button type="submit" class="reservation-button">Book Now</button>
         <button type="submit" class="reservation-button">Cancel</button>
    </form>
</div>


</body>
